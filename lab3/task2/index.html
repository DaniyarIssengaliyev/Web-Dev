<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ToDo List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <span class="topbar__title">ToDo List</span>
    </div>
  </header>

  <main class="page">
    <h1 class="page__title">ToDo List</h1>

    <form class="add" id="todo-form">
      <label class="sr-only" for="todo-input">New Task</label>
      <input
        id="todo-input"
        class="add__input"
        type="text"
        placeholder="New Task"
        autocomplete="off"
      />
      <button class="add__btn" type="submit">Add</button>
    </form>

    <section class="card" aria-label="Todo items">
      <ul class="list" id="todo-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
