<div class="card">
    <div class="img-wrap">
        <a [href]="selectedImage" target="_blank" rel="noopener noreferrer">
            <img class="main-img" [src]="selectedImage" [alt]="product.name">
        </a>
    </div>

    <div class="littles">
        <img *ngFor="let img of allImages"
            [src]="img" class="little" (click)="selectImage(img)"
            [class.active]="img == selectedImage">
    </div>

    <h3 class="name">{{ product.name }}</h3>
    <p class="desc">{{ product.description }}</p>

    <div class="row">
        <span class="price">{{ product.price }} &#8376;</span>
        <span class="rating">
            <span class="star" *ngFor="let filled of stars" [class.filled]="filled">&#9733;</span>
            <span class="rating-num">{{ product.rating }}</span>
        </span>
    </div>

    <div class="meta">
        <p class="likes" [class.bump]="justLiked">&#10084; {{ product.likes }}</p>
        <a class="link" [href]="product.link" target="_blank">Kaspi.kz</a>
    </div>

    <div class="actions">
        <button type="button" (click)="likeProduct()">Like</button>
        <button type="button" class="danger" (click)="onDelete()">Delete</button>
    </div>

    <div class="share">
        <button type="button" (click)="shareWhatsApp()">Share WhatsApp</button>
        <button type="button" (click)="shareTelegram()">Share Telegram</button>
    </div>
</div>
